name: Build Flutter APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create Clean Flutter Project
        run: |
          mkdir build_app
          cd build_app
          flutter create --org com.netscanner netscanner_app
          cd netscanner_app
          cp -f ../../app_main.dart lib/main.dart
          flutter pub add http url_launcher
          sed -i '/<application/i <uses-permission android:name="android.permission.INTERNET"\/>' android/app/src/main/AndroidManifest.xml
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk ../../app-release.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NetScanner-APK
          path: app-release.apk
