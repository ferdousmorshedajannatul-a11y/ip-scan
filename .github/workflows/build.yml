name: Build Flutter APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create Base Project Structure
        run: |
          flutter create --org com.netscanner .
          cp -f app_main.dart lib/main.dart

      - name: Install Dependencies
        run: |
          flutter pub add http url_launcher

      - name: Add Internet Permission
        run: |
          sed -i '/<application/i <uses-permission android:name="android.permission.INTERNET"\/>' android/app/src/main/AndroidManifest.xml

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NetScanner-APK
          path: build/app/outputs/flutter-apk/app-release.apk
