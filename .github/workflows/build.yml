name: Build Flutter APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Flutter Manually
        run: |
          git clone https://github.com/flutter/flutter.git -b stable --depth 1 $HOME/flutter
          echo "$HOME/flutter/bin" >> $GITHUB_PATH

      - name: Build Android App
        run: |
          export PATH="$HOME/flutter/bin:$PATH"
          mkdir workspace
          cd workspace
          flutter create --org com.netscanner netscanner_app
          cd netscanner_app
          cp -f ../../app_main.dart lib/main.dart
          flutter pub add http url_launcher
          sed -i '/<application/i <uses-permission android:name="android.permission.INTERNET"\/>' android/app/src/main/AndroidManifest.xml
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk ../../app-release.apk

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: NetScanner-APK
          path: app-release.apk
